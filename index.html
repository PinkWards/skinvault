<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkinVault — download only</title>
<style>
  :root{
    --bg:#0a1626; --panel:#12233a; --panel2:#172b45; --line:#253c58;
    --text:#e8f1ff; --dim:#8ba6c4; --acc:#00d3b8; --acc2:#1ecbe1; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:rgba(10,22,38,.96);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}
  .top{display:flex;align-items:center;gap:10px}
  h1{font-size:18px;margin:0;letter-spacing:.3px;flex:1}
  h1 span{color:var(--acc)}
  .badge{font-size:10px;color:var(--dim);border:1px solid var(--line);
    border-radius:20px;padding:3px 8px}
  button{font:inherit;cursor:pointer}
  .icon-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;font-size:13px}
  .icon-btn:active{transform:scale(.96)}
  .searchrow{display:flex;gap:8px;margin-top:10px}
  #q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:11px 13px;font-size:15px;outline:none}
  #q:focus{border-color:var(--acc)}
  .heroes{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;cursor:grab}
  .heroes.dragging{cursor:grabbing}
  .heroes::-webkit-scrollbar{display:none}
  .hero{width:58px;flex:0 0 58px;text-align:center;background:none;border:0;color:var(--dim);
    font-size:10px;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .hero img{width:50px;height:50px;border-radius:12px;object-fit:cover;
    background:var(--panel2);border:2px solid transparent;display:block;margin:0 auto 3px;
    pointer-events:none}
  .hero.on img{border-color:var(--acc)}
  .hero.on{color:var(--acc)}
  .meta{padding:8px 14px 10px;color:var(--dim);font-size:12px;display:flex;
    justify-content:space-between;gap:8px;align-items:center}
  .meta .who{color:var(--acc);font-weight:700}
  .meta .who button{background:none;border:0;color:var(--dim);padding:0 0 0 6px;font-size:12px}
  #list{padding:0 12px}
  .card{display:flex;gap:11px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px}
  .pair{flex:0 0 78px;display:flex;align-items:flex-start;gap:3px}
  .pair .cell{width:34px}
  .card img{width:34px;height:34px;border-radius:8px;object-fit:cover;
    background:var(--panel2);display:block}
  .arrow{font-size:11px;color:var(--acc2);padding-top:11px}
  .lbl{font-size:8px;color:var(--dim);text-align:center;margin-top:2px;letter-spacing:.4px}
  .info{flex:1;min-width:0}
  .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:9px;color:var(--acc2);border:1px solid #24566b;
    border-radius:6px;padding:1px 5px;margin-top:4px}
  .tag.warn{color:#ff9f6e;border-color:#7a3a1d;margin-left:4px}
  .bsel{display:block;width:100%;max-width:230px;margin:5px 0 0;padding:4px 6px;
    background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;font-size:11px;font-family:inherit}
  .meta .more{display:inline;width:auto;margin:0 0 0 8px;padding:2px 8px;
    font-size:10px;border-radius:8px}
  .acts{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
  .dl{background:var(--acc);color:#04222a;border:0;border-radius:10px;
    padding:8px 11px;font-size:12px;font-weight:800;text-decoration:none;text-align:center;
    font-family:inherit;cursor:pointer;min-width:86px}
  .dl[disabled]{opacity:.75;cursor:progress}
  .cp{background:transparent;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;padding:5px 11px;font-size:11px}
  .more{display:block;width:100%;margin:6px 0 20px;background:var(--panel);
    color:var(--acc);border:1px dashed var(--line);border-radius:12px;padding:12px}
  .empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px;line-height:1.6}
  #status{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0d2135;
    border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
    font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:center}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);
    border-radius:50%;display:none}
  .spin.on{display:block;animation:r .7s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:50;
    background:var(--acc);color:#04222a;padding:9px 16px;border-radius:20px;
    font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
  .toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>skin<span>vault</span> <span class="badge">download only</span></h1>
    <button class="icon-btn" id="refresh">refresh</button>
  </div>
  <div class="searchrow">
    <input id="q" placeholder="search hero or skin — lukas, sasuke, gojo…" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="clear">clear</button>
  </div>
</header>

<div class="heroes" id="heroes"></div>
<div class="meta"><span id="count">loading…</span><span id="age"></span></div>
<div id="list"></div>

<div id="status">
  <div class="spin" id="spin"></div>
  <span id="msg">starting…</span>
</div>
<div class="toast" id="toast"></div>

var MANIFEST = 'https://cdn.jsdelivr.net/gh/injctr/updates@main/kio.json';
// Second shelf: moleskin lists thousands of "install X over Y" packs across 131
// heroes, most of them on raw.githubusercontent (CORS-friendly). It fills the
// gaps injctr leaves — a hero whose only target was Collector gets the rest.
var MOLESKIN = 'https://cdn.jsdelivr.net/gh/MyMasWayVPN/moleskin@main/combined_manifest.json';
var CACHE_KEY = 'skinvault.index.v12';     // v12 = one card per real skin, face icons
var HERO_ICONS = {};                       // default hero icons, loaded from heroes.json
var HERO_ALIAS = { 'Lou Yi': 'Luo Yi' };   // manifest spelling -> wiki page spelling

// Skins[].type2 names the series and is usually right. In a handful of folders
// the label describes a different skin than the zips inside (Chou's "Saint Seiya
// Gold" folder only ever ships Libra Shiryu packs; Belerick's "Starlight" ships
// Joy Special). Those are source errors, not shorthand, so they are corrected
// here by hand — every other disagreement is just an abbreviation ("HxH",
// "AOT", "Annual") and the table label stays.
var NAME_FIX = {
  'Chou|SAINT SEIYA GOLD':    'Libra Shiryu',
  'Belerick|STARLIGHT':       'Joy Special',
  'Edith|COULDS':             'BTC',
  'Atlas|MSC 2033':           'MSC 2023'   // typo in the source; 2023 is in the game
};

function cleanNum(s){ return String(s||'').replace(/^\d+\s*/,'').trim(); }
// "Ling-Kungfu-Starlight" -> "Kungfu Starlight"; keeps the manifest's own casing.
function prettyName(s){
  return String(s||'').replace(/[-_]+/g,' ').replace(/\s+/g,' ')
    .replace(/^[^A-Za-z0-9]+/,'').replace(/[^A-Za-z0-9]+$/,'').trim();
}
// lookup key: case, punctuation and spacing must not decide which icon a card gets
function normName(s){ return prettyName(s).toLowerCase(); }
// display name: manifest keys are SHOUTED ("05 KUNG FU PANDA"), keep real acronyms
var ACRONYMS = {'KOF':1,'AOT':1,'JJK':1,'M1':1,'M2':1,'M3':1,'SF':1,'MLBB':1,'MVP':1,'STUN':1,'S':1};
function titleName(s){
  var raw = String(s||'').trim();
  if(/^(?:[A-Za-z]\.){2,}[A-Za-z]?\.?$/.test(raw)) return raw.replace(/\.$/,'');
  var t = prettyName(raw);
  if(!t) return t;
  return t.split(' ').map(function(w){
    if(ACRONYMS[w.toUpperCase()] && w === w.toUpperCase()) return w;
    if(/^\d/.test(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}
function isZip(s){ return typeof s === 'string' && /\.zip(?:\?.*)?$/i.test(s); }

// --- in game or not ------------------------------------------------------
// The manifest also carries skins the game has not shipped yet: datamined art
// and packs built off the advanced server. Those are named in the dated block
// below and stay out of the default list. Everything else is in the game.
var NOT_YET = [];                          // idKey(hero)+'/'+idKey(skin)
function idKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function isInGame(hero, skin){
  if(NOT_YET.indexOf(idKey(hero) + '/' + idKey(skin)) !== -1) return false;
  var y = String(skin||'').match(/\b(20\d{2})\b/);
  return !(y && +y[1] > 2026);             // a future year in the name is not out yet
}
function fileName(u){
  try { return decodeURIComponent(new URL(u).pathname.split('/').pop()) || 'skin.zip'; }
  catch(e){ return 'skin.zip'; }
}
function deriveSkin(key, hero, url){
  // The manifest key is often the SOURCE folder, while the filename carries
  // the actual skin ("Suyou Sasuke - Default.zip" under key "Naruto").
  var fn = fileName(url).replace(/\.zip$/i,'');
  // injctr names its zips "<hero> <skin> - <base>.zip". Anything else (Dropbox
  // mirrors name the file "<hero>-<skin>-<base>") is clearer from the key.
  var head = fn.indexOf(' - ') !== -1 ? fn.split(' - ')[0] : '';
  var cand = head.replace(new RegExp('^'+hero.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i'),'').trim();
  return titleName(cand) || titleName(cleanNum(key));
}

function buildIndex(root){
  var d = Array.isArray(root) ? (root[0]||{}) : (root||{});
  var out = [];
  var seen = Object.create(null);

  function push(o){
    if(!o.url || seen[o.url]) return;
    seen[o.url] = 1;
    out.push(o);
  }

  var heroes = d.Hero || {};
  Object.keys(heroes).forEach(function(hero){
    var h = heroes[hero] || {};
    var reps = h.Replacements || {};

    // Default hero icon — the real one, from heroes.json, never skin art.
    var heroImg = HERO_ICONS[hero] || HERO_ICONS[HERO_ALIAS[hero]] || '';

    // Target skins: Skins[].img2 is the icon of the skin going in.
    var skinIcons = {};
    var skins = h.Skins || {};
    Object.keys(skins).forEach(function(k){
      var sk = skins[k] || {};
      var ic = sk.img2 || sk.img1 || '';
      if(!ic) return;
      skinIcons[normName(cleanNum(k))] = ic;
      if(sk.type2) skinIcons[normName(sk.type2)] = ic;
    });

    // Base skins: Replacements[].img1 is the icon of the skin being replaced.
    // When that base is also a real skin in the Skins table its own icon wins,
    // because a few manifest rows carry the wrong img1.
    var baseIcons = {};
    Object.keys(reps).forEach(function(k){
      var b = reps[k] || {};
      var nm = normName(b.type1 || cleanNum(k));
      if(b.img1 && !baseIcons[nm]) baseIcons[nm] = b.img1;
      if(!skinIcons[nm] && baseIcons[nm]) skinIcons[nm] = baseIcons[nm];
    });

    Object.keys(reps).forEach(function(baseKey){
      var base = reps[baseKey] || {};
      var baseName = base.type1 || cleanNum(baseKey);
      var fromImg = skinPic(hero, baseName) || heroPic(hero) ||
                    skinIcons[normName(baseName)] || baseIcons[normName(baseName)] || base.img1;

      [['type_links',''], ['second_link','mirror']].forEach(function(g){
        var tbl = base[g[0]] || {};
        Object.keys(tbl).forEach(function(skinKey){
          var url = tbl[skinKey];
          if(!isZip(url)) return;
          var key = normName(cleanNum(skinKey));
          // the Skins table names the series; the zip filename is whatever the
          // packer typed (Khufta, Aldous Annual...). Trust the table first,
          // then the hand corrections, then the filename.
          var skRow = skins[skinKey] || {};
          var skinName = NAME_FIX[hero+'|'+cleanNum(skinKey)] ||
                         (skRow.type2 && String(skRow.type2).trim()) ||
                         deriveSkin(cleanNum(skinKey), hero, url);
          // "Collector" is a tier, not a skin. Turn it into the name the game
          // shows before anything downstream (gate, grouping, icon) sees it.
          skinName = realName(hero, skinName);
          // Only a skin the dex knows for this hero becomes a card. injctr also
          // carries fan packs ("Bane Mr. Krabs", "Alucard Gon") and the dex is
          // the authority on what the game actually ships.
          if(!isRealSkin(hero, skinName)) return;
          // the icon follows the name on the card, then the manifest key
          var toImg = skinPic(hero, skinName) || skinIcons[normName(skinName)] || skinIcons[key] || '';
          // no picture of the skin going in means no card — the default hero
          // portrait would print the same face on both sides of the swap
          if(!toImg) return;
          // a pack that installs X over X is not a swap. The source has one —
          // Chou's Libra Shiryu folder lists its own base — so drop that row.
          if(normName(baseName) === normName(skinName)) return;
          push({
            hero: hero,
            skin: skinName,
            base: baseName,
            url: url,
            fromImg: (fromImg === toImg && heroImg && heroImg !== toImg) ? heroImg : fromImg,
            toImg: toImg,
            inGame: isInGame(hero, skinName),
            heroImg: heroImg,
            group: 'Skin',
            mirror: g[1]
          });
        });
      });
    });
  });

  // Custom crossovers, recalls, emotes, trails and other effects are excluded.
  return out;
}

// --- second shelf: moleskin ------------------------------------------------
// Labels there are lowercase and loose ("star", "collector", "default skin").
// Map the few that would otherwise sit next to an injctr card under a
// different name, and title-case the rest.
var MOL_ALIAS = {
  'star': 'Starlight', 'star 2': 'Starlight 2', 'star2': 'Starlight 2',
  'annual star': 'Annual Starlight', 'default skin': 'Default',
  'msc': 'MSC', 'kof': 'KOF', 'jjk': 'JJK', 'aot': 'AOT',
  'm1': 'M1', 'm2': 'M2', 'm3': 'M3', 'msc 2033': 'MSC 2023',
  // the same skin spelled two ways across the two shelves; folding here is
  // cheaper and safer than fuzzy-matching card titles
  'fvmp': 'FMVP', 'fmvp': 'FMVP',
  'misbender': 'Mistbender', 'mistbenders': 'Mistbender',
  'transformerd': 'Transformers', 'transformes': 'Transformers'
};
function molName(s){
  var t = titleName(s);
  return MOL_ALIAS[t.toLowerCase()] || t;
}

// moleskin spells a dozen heroes its own way. Point them at the canonical name
// so one hero's packs land on one card instead of splitting in two.
var MOL_HERO_ALIAS = {
  'Balerick': 'Belerick', 'Chang e': "Chang'e", 'Fredrin': 'Fredrinn',
  'Lilya': 'Lylia', 'Minsittar': 'Minsitthar', 'Odete': 'Odette',
  'Parsha': 'Pharsa', 'Popol & Kupa': 'Popol and Kupa', 'Silvana': 'Silvanna',
  'Thamus': 'Thamuz', 'X-Borg': 'X.Borg', 'Yi Shun Shin': 'Yi Sun-shin',
  'Luo Yi': 'Lou Yi'
};

function buildMoleskin(root){
  var out = [];
  var seen = Object.create(null);
  var data = root || {};
  Object.keys(data).forEach(function(rawHero){
    var hero = MOL_HERO_ALIAS[rawHero] || rawHero;
    var hv = data[rawHero] || {};
    var rows = hv.skins || [];

    // The "Default Skin" row carries the real default hero portrait, which is
    // also the only icon moleskin has for heroes missing from heroes.json.
    var heroImg = heroPic(hero);
    if(!heroImg){
      rows.forEach(function(s){
        if(heroImg) return;
        if(/default/i.test(s.skin_name || '')) heroImg = s.img || s.img2 || '';
      });
    }

    rows.forEach(function(s){
      var url = s.download;
      if(!isZip(url) || seen[url]) return;
      seen[url] = 1;
      // category "Upgrade" rows are explicit swaps: skin_name is the base,
      // skin_name2 is the skin going in. "Default" rows install over Default.
      var isUp = String(s.category || '') === 'Upgrade' && String(s.skin_name2 || '').trim();
      var skin = molName(isUp ? s.skin_name2 : s.skin_name);
      var base = isUp ? molName(s.skin_name) : 'Default';
      if(!skin) return;
      skin = realName(hero, skin);
      // moleskin is half fan-made: Luffy, Jake, Saitama, Super Mario. Only the
      // names the game actually ships become cards; the rest never enter.
      if(!isRealSkin(hero, skin)) return;
      // a pack that installs X over X is not a swap
      if(normName(skin) === normName(base)) return;
      var toImg = skinPic(hero, skin) || s.img2 || s.img || heroImg;
      var fromImg = (isUp ? (skinPic(hero, base) || s.img) : heroImg) || heroImg;
      // moleskin sometimes hands back the same portrait for both sides; the
      // default hero icon is the honest "from" when that happens. If even that
      // is the same picture, there is nothing to show — drop the row rather
      // than print one face twice.
      if(fromImg === toImg && heroImg && heroImg !== toImg) fromImg = heroImg;
      if(fromImg === toImg) return;
      out.push({
        hero: hero,
        skin: skin,
        base: base,
        url: url,
        fromImg: fromImg,
        toImg: toImg,
        inGame: isInGame(hero, skin),
        heroImg: heroImg,
        group: 'Skin',
        mirror: '',
        src: 'moleskin'
      });
    });
  });
  return out;
}

// Both shelves sell the same swap for the same hero+skin+base. injctr wins the
// tie: cleaner names, and its links live on raw.githubusercontent, which the
// in-app download can fetch without a CORS fight. Its base labels also win —
// moleskin's "Starlight" is the same slot injctr calls "Starlight 2021".
function mergeIndex(primary, extra){
  var out = primary.slice();
  var seen = Object.create(null);
  var bases = Object.create(null);          // heroKey -> [label, ...]
  function mark(it){
    seen[idKey(it.hero) + '|' + normName(it.skin) + '|' + normName(it.base)] = 1;
    seen['u|' + it.url] = 1;
  }
  primary.forEach(function(it){
    mark(it);
    (bases[idKey(it.hero)] = bases[idKey(it.hero)] || []).push(it.base);
  });
  function canonBase(hero, base){
    var list = bases[idKey(hero)];
    if(!list) return base;
    var nb = normName(base), hits = [];
    for(var i = 0; i < list.length; i++){
      var nl = normName(list[i]);
      if(nl === nb) return list[i];
      // "Starlight" vs "Starlight 2021": accept only an unambiguous prefix
      if(nl.indexOf(nb) === 0 || nb.indexOf(nl) === 0) hits.push(list[i]);
    }
    var uniq = hits.filter(function(v, i, a){ return a.indexOf(v) === i; });
    return uniq.length === 1 ? uniq[0] : base;
  }
  (extra || []).forEach(function(it){
    var base = canonBase(it.hero, it.base);
    var k = idKey(it.hero) + '|' + normName(it.skin) + '|' + normName(base);
    if(seen[k] || seen['u|' + it.url]) return;
    if(base !== it.base) it = Object.assign({}, it, { base: base });
    mark(it);
    out.push(it);
  });
  return out;
}

function filterItems(items, q, hero){
  q = (q||'').toLowerCase().trim();
  var terms = q ? q.split(/\s+/) : [];
  return items.filter(function(it){
    if(hero && it.hero !== hero) return false;
    if(!terms.length) return true;
    var hay = (it.hero+' '+it.skin+' '+it.base+' '+fileName(it.url)).toLowerCase();
    return terms.every(function(t){ return hay.indexOf(t) !== -1; });
  });
}
/* PURE END */

var state = { items:[], q:'', hero:'', shown:60, age:0, unverified:false, groups:[] };

function $(id){ return document.getElementById(id); }
function say(t, busy){
  $('msg').textContent = t;
  $('spin').className = busy ? 'spin on' : 'spin';
}
function toast(t){
  var el=$('toast'); el.textContent=t; el.className='toast on';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.className='toast'; },1600);
}
function esc(s){
  return String(s||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function heroIcon(name){
  return HERO_ICONS[name] || HERO_ICONS[HERO_ALIAS[name]] || '';
}
// Wikia serves a 404 placeholder when a request carries a Referer, and browsers
// cache that. A version tag forces a fresh fetch, and meta referrer=no-referrer
// stops the Referer from being sent at all.
var ICON_V = 'v=3';
function bust(u){
  if(!u || u.indexOf('data:') === 0) return u;
  return u + (u.indexOf('?') === -1 ? '?' : '&') + ICON_V;
}

function baked(id){
  try{
    var el = document.getElementById(id);
    if(el && el.textContent) return JSON.parse(el.textContent);
  }catch(e){}
  return null;
}
function inlineHeroIcons(){ return baked('heroicons'); }
async function loadHeroIcons(){
  if(Object.keys(HERO_ICONS).length) return;
  var baked = inlineHeroIcons();
  if(baked){ HERO_ICONS = baked; return; }
  try{
    var r = await fetch('./heroes.json?v=2', {cache:'no-store'});
    if(r.ok) HERO_ICONS = await r.json();
  }catch(e){}
}
// the dated skin list that decides what the game actually has.
// Lives in the repo so the hold-back list updates without a new build.
var RELEASED_URL = 'https://raw.githubusercontent.com/PinkWards/skinvault/main/released.json';
async function loadReleased(){
  // The repo copy is the live one; the copy baked into the page is the offline
  // fallback. Union them, never replace: a repo file that lags behind the build
  // must not un-hide a skin the build already knows about, and a newer repo file
  // must not need a rebuild to take effect.
  var lists = [];
  var b = baked('released');
  if(b && b.hidden) lists.push(b.hidden);
  try{
    var r = await fetch(RELEASED_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      var d = await r.json();
      if(d && d.hidden) lists.push(d.hidden);
    }
  }catch(e){}
  var seen = Object.create(null);
  lists.forEach(function(list){
    list.forEach(function(p){
      var k = idKey(p[0]) + '/' + idKey(p[1]);
      if(seen[k]) return;
      seen[k] = 1;
      NOT_YET.push(k);
    });
  });
}

// --- only real skins -------------------------------------------------------
// REAL is the in-game skin vocabulary: every released skin name, series label
// and rarity from the MLBB dex, baked in at build time. moleskin also carries
// fan-made mods (Luffy, Jake, Saitama, Super Mario) and those names are not in
// here, so they never reach the shelf. markReal() then folds in every name the
// clean injctr manifest already sells, so a real series label the dex spells
// differently still matches.
var REAL_HERO = Object.create(null);   // idKey(hero) -> [idKey(skin), ...]
var REAL_ALL = Object.create(null);    // every key from any hero, flat
(function seedReal(){
  var d = baked('real') || {};
  Object.keys(d).forEach(function(h){
    var a = d[h] || [];
    REAL_HERO[h] = a.slice();
    for(var i = 0; i < a.length; i++) REAL_ALL[a[i]] = 1;
  });
})();
function markReal(items){
  // kept for API stability; the vocabulary is the dex, not the shelf
}
function isRealSkin(hero, skin){
  var k = idKey(skin);
  if(!k) return false;
  var list = REAL_HERO[idKey(hero)];
  if(!list || !list.length) return false;
  for(var i = 0; i < list.length; i++){
    var r = list[i];
    if(r === k) return true;
    if(oneLetterOff(r, k) || tailWord(r, k) || sameWords(r, k)) return true;
    // the dex names the skin in full ("Venom Monitor Lizard"), moleskin shortens
    // it ("Monitor Lizard"). One containing the other, five letters or longer,
    // is the same skin — short collisions like "Ace" and "Aces" stay out.
    if(r.length >= 5 && k.length >= 5 && (r.indexOf(k) !== -1 || k.indexOf(r) !== -1)) return true;
  }
  // the shelf may still be using a tier name the dex spells differently
  var t = LABEL_SKIN[idKey(hero) + '/' + k];
  if(t){
    for(var j = 0; j < list.length; j++) if(list[j] === t) return true;
  }
  return false;
}

// --- face icons ------------------------------------------------------------
// Every real skin has a portrait crop on the wiki: a square of the face, not
// the whole splash art. The map holds the skin id and the wiki's hash folder,
// which is all the URL needs. Rendering from this instead of the manifest's
// img2 is what stops Cursed Scroll showing the default Khufra face twice.
var PORTRAIT = Object.create(null);        // idKey(hero)/idKey(skin) -> "788:f/f2"
var HERO_PORTRAIT = Object.create(null);   // idKey(hero) -> "781:0/0f"
var LABEL_SKIN = Object.create(null);      // idKey(hero)/idKey(label) -> idKey(skin)
var SKIN_NAME = Object.create(null);       // idKey(skin) -> proper spelling
var LABEL_LIST = Object.create(null);      // idKey(hero) -> [idKey(label), ...]
(function seedPortraits(){
  var d = baked('portraits') || {};
  var s = d.skins || {}, h = d.hero || {}, l = d.labels || {}, n = d.names || {};
  Object.keys(s).forEach(function(k){ PORTRAIT[k] = s[k]; });
  Object.keys(h).forEach(function(k){ HERO_PORTRAIT[k] = h[k]; });
  Object.keys(n).forEach(function(k){ SKIN_NAME[k] = n[k]; });
  Object.keys(l).forEach(function(k){
    LABEL_SKIN[k] = l[k];
    var bar = k.indexOf('/');
    if(bar > 0){
      var hero = k.slice(0, bar);
      (LABEL_LIST[hero] = LABEL_LIST[hero] || []).push(k.slice(bar + 1));
    }
  });
})();
// injctr sells a skin under its tier ("Collector", "Epic"), the game and the
// dex sell it under its name. Resolve the tier to the name so one skin is one
// card, and so the card says what the player actually sees.
function realName(hero, skin){
  var h = idKey(hero), k = idKey(skin);
  if(!k) return skin;
  var t = LABEL_SKIN[h + '/' + k];
  if(t && SKIN_NAME[t]) return SKIN_NAME[t];
  // "Colector" is the same tier typed by hand. Match a one-letter misspelling
  // against this hero's own tiers only, never across heroes.
  var list = LABEL_LIST[h];
  if(list){
    for(var i = 0; i < list.length; i++){
      if(oneLetterOff(list[i], k)){
        var m = LABEL_SKIN[h + '/' + list[i]];
        if(m && SKIN_NAME[m]) return SKIN_NAME[m];
      }
    }
  }
  return skin;
}
function portraitUrl(spec){
  if(!spec) return '';
  var i = spec.indexOf(':');
  if(i < 1) return '';
  return 'https://static.wikia.nocookie.net/mobile-legends/images/' +
         spec.slice(i + 1) + '/Hero' + spec.slice(0, i) + '-portrait.png/revision/latest';
}
function skinPic(hero, skin){
  var h = idKey(hero), k = idKey(skin);
  if(!k) return '';
  var p = PORTRAIT[h + '/' + k];
  if(p) return portraitUrl(p);
  // injctr names a skin by its series — "Collector", "Epic", "Elite 1" — and
  // the dex names it properly. Resolve through that before giving up.
  var t = LABEL_SKIN[h + '/' + k];
  if(t && PORTRAIT[h + '/' + t]) return portraitUrl(PORTRAIT[h + '/' + t]);
  var m = k.match(/^(.+?)(20\d\d)$/);          // "Starlight 2021" -> "Starlight"
  if(m){
    var t2 = LABEL_SKIN[h + '/' + m[1]];
    if(t2 && PORTRAIT[h + '/' + t2]) return portraitUrl(PORTRAIT[h + '/' + t2]);
  }
  return '';
}
function heroPic(hero){
  return portraitUrl(HERO_PORTRAIT[idKey(hero)]) ||
         HERO_ICONS[hero] || HERO_ICONS[HERO_ALIAS[hero]] || '';
}

function loadCache(){
  try{
    var c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c && c.items && c.items.length && c.items[0].fromImg !== undefined && c.items[0].inGame !== undefined){
      state.items=c.items; state.age=c.ts||0;
      return true;
    }
  }catch(e){}
  return false;
}
function saveCache(items){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(),items:items})); }
  catch(e){ /* over quota — the catalog still loads, it just starts cold next time */ }
}

async function fetchJson(u){
  var r = await fetch(u, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function refresh(){
  await loadHeroIcons();
  await loadReleased();
  say('fetching catalog…', true);
  var items = null, note = '';

  // Both shelves in one go; moleskin is optional, injctr is not.
  var both = await Promise.allSettled([
    fetchJson(MANIFEST + '?t=' + Date.now()),
    fetchJson(MOLESKIN + '?t=' + Date.now())
  ]);

  try{
    if(both[0].status !== 'fulfilled') throw new Error('primary down');
    items = buildIndex(both[0].value);
  }catch(e){
    var local = baked('manifest');
    if(local){ items = buildIndex(local); note = ' (offline manifest)'; }
  }
  if(items){
    markReal(items);
    if(both[1].status === 'fulfilled'){
      var before = items.length;
      items = mergeIndex(items, buildMoleskin(both[1].value));
      if(items.length > before) note += ' +' + (items.length - before) + ' from moleskin';
    }else{
      note += ' (moleskin offline)';
    }
  }

  if(items && items.length > 100){
    state.items = items;
    state.age = Date.now();
    saveCache(items);
    renderHeroes(); render();
    say(items.length + ' packs ready' + note, false);
  }else{
    say('offline — showing cached catalog (' + (state.items.length||0) + ')', false);
    if(!state.items.length) $('list').innerHTML =
      '<div class="empty">no catalog yet.<br>connect to the internet and tap refresh.</div>';
  }
}

function renderHeroes(){
  var map = {};
  state.items.forEach(function(it){ if(it.heroImg) map[it.hero] = it.heroImg; });
  var names = Object.keys(map).sort(function(a,b){ return a.localeCompare(b); });
  var html = '';
  names.forEach(function(n){
    html += '<button class="hero'+(state.hero===n?' on':'')+'" data-h="'+esc(n)+'">'+
            '<img src="'+esc(bust(map[n]))+'" alt="">'+esc(n.slice(0,9))+'</button>';
  });
  $('heroes').innerHTML = html;
}

// One card per skin. The manifest ships a pack per (skin being installed, skin
// being replaced), so Khufra "Collector" is seven rows with one target — fold
// them into a single card and let the base picker choose what gets replaced.
// Two labels that differ by a single letter are the same skin spelled twice
// ("Mistbender"/"Mistbenders", "Transformers"/"Transformes"); fold those too,
// but never across digits, so "Starlight" and "Starlight 2" stay apart.
function oneLetterOff(a, b){
  if(!a || !b) return false;
  if(/\d/.test(a) || /\d/.test(b)) return false;
  // longer names tolerate a second typo; short ones must be a single edit apart
  var budget = (a.length >= 9 && b.length >= 9) ? 2 : 1;
  if(Math.abs(a.length - b.length) > budget) return false;
  var dist = editDistance(a, b);
  return dist > 0 && dist <= budget;
}
function editDistance(a, b){
  var prev = [], cur = [], i, j;
  for(j = 0; j <= b.length; j++) prev[j] = j;
  for(i = 1; i <= a.length; i++){
    cur[0] = i;
    for(j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    for(j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

// Spelled differently by each shelf but the same skin. Keyed by idKey, so the
// map applies to whatever case and punctuation the source used.
var SKIN_CANON = {
  misbender: 'Mistbender', mistbender: 'Mistbender',
  transformerd: 'Transformers', transformes: 'Transformers',
  fvmp: 'FMVP', fmvp: 'FMVP'
};

// Two names are the same skin when one is the other plus a plain word:
// "Saint Seiya" / "Saint Seiya Bronze", "Neobeast" / "Neobeast Lylia",
// "Dawning" / "Dawning Hero". A number in the tail means a different skin, so
// "Street Fighter 1" and "Street Fighter 2" stay apart.
function tailWord(a, b){
  if(!a || !b || a === b) return false;
  var short = a.length <= b.length ? a : b;
  var long  = a.length <= b.length ? b : a;
  if(long.indexOf(short) !== 0) return false;
  var tail = long.slice(short.length);
  return tail.length > 1 && !/\d/.test(tail);
}

// A card is the skin, not the label. injctr sells Khufra's Collector skin as
// "Collector", moleskin sells the same skin as "Volcanic Overlord"; one shows
// the dex name, the other the tier. So rows are bucketed into a canonical
// cluster first, and the card is keyed on the cluster — never on whichever
// spelling happened to arrive first. That was the dupe: keying on the label let
// one skin become two cards the moment a longer name replaced it mid-file.
function sameWords(a, b){
  if(!a || !b || a === b) return false;
  var A = a.split(' ').sort().join(' '), B = b.split(' ').sort().join(' ');
  return A === B;
}

function groupItems(list){
  var clusters = Object.create(null), heroOrder = [];
  list.forEach(function(it){
    var nm = SKIN_CANON[idKey(it.skin)] || normName(it.skin);
    var label = SKIN_CANON[idKey(it.skin)] || it.skin;
    var bucket = clusters[it.hero] || (clusters[it.hero] = []);
    if(!bucket.length) heroOrder.push(it.hero);

    // The hero's own default portrait is the fallback for every skin that has
    // no portrait, so it can never be used as proof of identity.
    var defaultPic = heroPic(it.hero);
    var hit = null;
    for(var i = 0; i < bucket.length; i++){
      var c = bucket[i];
      if(c.img && it.toImg && c.img === it.toImg && it.toImg !== defaultPic){ hit = c; break; }
      if(c.nm === nm || oneLetterOff(c.nm, nm) || tailWord(c.nm, nm) ||
         sameWords(c.nm, nm)){ hit = c; break; }
    }
    if(!hit){
      hit = { nm: nm, label: label, img: it.toImg, heroImg: it.heroImg,
              inGame: false, bases: [] };
      bucket.push(hit);
    }else{
      if(!hit.img && it.toImg && it.toImg !== defaultPic) hit.img = it.toImg;
      // the fuller name wins ("Volcanic Overlord" over "Collector"), but a
      // numbered label is a different skin and never replaces a plain one
      if(nm.length > hit.nm.length && !/\d/.test(nm)){ hit.nm = nm; hit.label = label; }
      if(!hit.heroImg && it.heroImg) hit.heroImg = it.heroImg;
    }
    if(it.inGame) hit.inGame = true;
    hit.bases.push(it);
  });

  var out = [];
  heroOrder.forEach(function(hero){
    var defaultPic = heroPic(hero);
    var bucket = clusters[hero];
    // Resolve each cluster's face before merging: two clusters that only learn
    // the same face after resolution are still the same skin.
    bucket.forEach(function(c){
      c.pic = skinPic(hero, c.label) || c.img || '';
      if(c.pic === defaultPic) c.pic = '';
    });
    // Second pass: a cluster that only learned its face after another cluster
    // existed never got compared against it. Same face, same hero, same skin —
    // fold them, keeping the richer name and every base from both.
    for(var i = 0; i < bucket.length; i++){
      var a = bucket[i];
      if(!a.pic) continue;
      for(var j = i + 1; j < bucket.length; j++){
        var b = bucket[j];
        if(b.pic !== a.pic) continue;
        if(b.nm.length > a.nm.length && !/\d/.test(b.nm)){ a.nm = b.nm; a.label = b.label; }
        for(var k = 0; k < b.bases.length; k++) a.bases.push(b.bases[k]);
        if(b.inGame) a.inGame = true;
        if(!a.heroImg && b.heroImg) a.heroImg = b.heroImg;
        bucket.splice(j, 1);
        j--;
      }
    }
    bucket.forEach(function(c){
      // The card's face comes from the name that won, not from the first row.
      var pic = c.pic || skinPic(hero, c.label) || c.img || heroPic(hero);
      // One base, one option. injctr and moleskin both sell "Default" for the
      // same skin through different zips; the picker must list it once.
      var seenBase = Object.create(null), bases = [];
      c.bases.sort(function(x, y){
        return String(x.base).localeCompare(String(y.base), undefined, {numeric:true});
      });
      c.bases.forEach(function(it){
        var bk = normName(it.base);
        if(seenBase[bk]) return;
        seenBase[bk] = 1;
        bases.push(it);
      });
      out.push({ key: hero + '\u0000' + c.nm, hero: hero, skin: c.label, nm: c.nm,
                 toImg: pic, heroImg: c.heroImg || heroPic(hero),
                 inGame: c.inGame, bases: bases });
    });
  });
  return out;
}

function render(){
  var all = filterItems(state.items, state.q, state.hero);
  var allGroups = groupItems(all);
  var liveGroups = allGroups.filter(function(g){ return g.inGame; });
  var groups = state.unverified ? allGroups : liveGroups;
  var hideCount = allGroups.length - liveGroups.length;

  var toggle = hideCount
    ? ' <button class="more" id="unv">' + (state.unverified
        ? 'hide ' + hideCount + ' not in game'
        : '+' + hideCount + ' not in game') + '</button>'
    : '';
  $('count').innerHTML = (state.hero
    ? '<span class="who">'+esc(state.hero)+' <button id="unhero">×</button></span> '
    : '') + groups.length.toLocaleString() + (groups.length === 1 ? ' skin' : ' skins') +
    ' · ' + all.length.toLocaleString() + ' packs' + toggle;
  $('age').textContent = state.age
    ? 'updated '+Math.max(0,Math.round((Date.now()-state.age)/60000))+'m ago'
    : '';

  state.groups = groups;

  if(!groups.length){
    $('list').innerHTML='<div class="empty">nothing matched in game.<br>try just a hero name.</div>' +
      (hideCount && !state.unverified ? '<button class="more" id="unv">show ' + hideCount + ' not in game</button>' : '');
    return;
  }
  var slice = groups.slice(0, state.shown);
  var tile = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><rect width="34" height="34" fill="#172b45"/></svg>');

  function icon(src, fallback, cls){
    var f = fallback || tile;
    return '<img'+(cls?' class="'+cls+'"':'')+' loading="lazy" src="'+esc(bust(src||f))+
      '" onerror="this.onerror=null;this.src=\''+esc(bust(f))+'\'" alt="">';
  }

  var html = slice.map(function(g, i){
    var it = g.bases[0];
    var fn = fileName(it.url);
    var fb = g.heroImg || tile;
    var opts = g.bases.map(function(b, bi){
      return '<option value="'+bi+'"'+(bi===0?' selected':'')+'>'+esc(b.base)+'</option>';
    }).join('');
    return '<div class="card" data-i="'+i+'">'+
      '<div class="pair">'+
        '<div class="cell">'+icon(it.fromImg, fb, 'fi')+'<div class="lbl">from</div></div>'+
        '<span class="arrow">›</span>'+
        '<div class="cell">'+icon(g.toImg, fb)+'<div class="lbl">to</div></div>'+
      '</div>'+
      '<div class="info">'+
        '<div class="t1">'+esc(g.hero)+' — '+esc(g.skin)+'</div>'+
        '<div class="t2">'+esc(fn)+'</div>'+
        '<select class="bsel" aria-label="replace which skin">'+opts+'</select>'+
        '<span class="tag">'+g.bases.length+(g.bases.length===1?' base':' bases')+'</span>'+
        (g.inGame?'':'<span class="tag warn">not in game</span>')+
      '</div>'+
      '<div class="acts">'+
        '<button class="dl" data-d="'+esc(it.url)+'" data-n="'+esc(fn)+'">download</button>'+
        '<button class="cp" data-u="'+esc(it.url)+'">copy link</button>'+
      '</div>'+
    '</div>';
  }).join('');
  if(groups.length > state.shown)
    html += '<button class="more" id="more">show more ('+(groups.length-state.shown)+' left)</button>';
  $('list').innerHTML = html;
}

$('q').addEventListener('input', function(e){
  state.q=e.target.value; state.shown=60; render();
});
$('clear').addEventListener('click', function(){
  state.q=''; state.hero=''; state.shown=60;
  $('q').value='';
  renderHeroes(); render();
});
$('heroes').addEventListener('click', function(e){
  var b=e.target.closest('.hero'); if(!b) return;
  state.hero = (state.hero === b.dataset.h) ? '' : b.dataset.h;
  state.shown=60;
  renderHeroes(); render();
});
$('list').addEventListener('change', function(e){
  var s = e.target.closest('.bsel'); if(!s) return;
  var card = s.closest('.card'); if(!card) return;
  var g = state.groups[+card.dataset.i]; if(!g) return;
  var it = g.bases[+s.value]; if(!it) return;
  var fn = fileName(it.url);
  var img = card.querySelector('.fi');
  if(img){
    img.src = bust(it.fromImg || g.heroImg);
    img.onerror = function(){
      this.onerror = null;
      this.src = bust(g.heroImg || img.src);
    };
  }
  card.querySelector('.t2').textContent = fn;
  var dl = card.querySelector('.dl');
  dl.dataset.d = it.url;
  dl.dataset.n = fn;
  card.querySelector('.cp').dataset.u = it.url;
});

$('list').addEventListener('click', function(e){
  if(e.target.id === 'unhero'){
    state.hero=''; state.shown=60; renderHeroes(); render(); return;
  }
  if(e.target.id==='unv'){
    state.unverified = !state.unverified; state.shown=60; render(); return;
  }
  var more=e.target.closest('#more'); if(more){ state.shown+=100; render(); return; }
  var d=e.target.closest('.dl');
  if(d){ saveZip(d.dataset.d, d.dataset.n, d); return; }
  var b=e.target.closest('.cp'); if(!b) return;
  copyText(b.dataset.u);
});

function copyText(u){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){toast('link copied');});
  }else{
    var ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('link copied');
  }
}

// github.com/OWNER/REPO/raw/BRANCH/PATH 302s to raw.githubusercontent.com,
// and that hop carries no CORS headers, so the fetch dies. Ask the raw host directly.
function rawUrl(u){
  var s = String(u || '');
  var m = s.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/raw\/(.+)$/);
  if(m) return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3];
  // dropbox share links do the same trick: the www host has no CORS, the
  // content host does.
  var d = s.match(/^https?:\/\/(?:www\.)?dropbox\.com\/s\/([^?]+)/);
  if(d) return 'https://dl.dropboxusercontent.com/s/' + d[1] + '?dl=1';
  return s;
}

// GitHub release assets redirect to a host that sends no CORS headers at all,
// so a fetch can never read the bytes. Those go straight to the browser's own
// downloader through a hidden frame — it still never leaves the page.
function noCors(u){
  return /^https?:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\//.test(String(u || ''));
}

function handOff(url, name, btn, old){
  var f = document.createElement('iframe');
  f.style.display = 'none';
  f.src = url;
  document.body.appendChild(f);
  setTimeout(function(){ f.remove(); }, 60000);
  btn.textContent = old;
  btn.disabled = false;
  toast('sent to downloads — ' + (name || 'skin.zip'));
}

// Pull the zip through fetch and hand the phone a blob, so nothing leaves the app:
// an <a href> download opens a tab and lands on github.raw instead.
async function saveZip(url, name, btn){
  var old = btn.textContent;
  if(noCors(url)){ handOff(url, name, btn, old); return; }
  btn.disabled = true;
  btn.textContent = '0%';
  try{
    var r = await fetch(rawUrl(url), {mode:'cors', cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    var total = parseInt(r.headers.get('content-length') || '0', 10) || 0;
    var blob;
    if(r.body && r.body.getReader){
      var reader = r.body.getReader(), chunks = [], got = 0;
      for(;;){
        var step = await reader.read();
        if(step.done) break;
        chunks.push(step.value);
        got += step.value.length;
        btn.textContent = total
          ? Math.max(1, Math.round(got * 100 / total)) + '%'
          : (got / 1048576).toFixed(1) + ' MB';
      }
      blob = new Blob(chunks, {type:'application/zip'});
    }else{
      blob = await r.blob();
    }
    var obj = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = obj;
    a.download = name || 'skin.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(obj); }, 60000);
    btn.textContent = 'saved';
    toast('saved ' + (name || 'skin.zip'));
    setTimeout(function(){ btn.textContent = old; btn.disabled = false; }, 4000);
  }catch(err){
    // last resort: hand the URL to the browser's downloader without leaving the page
    handOff(url, name, btn, old);
  }
}

// horizontal hero strip: mouse wheel + drag on desktop, native swipe on touch
var strip = $('heroes');
strip.addEventListener('wheel', function(e){
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    e.preventDefault();
    strip.scrollLeft += e.deltaY;
  }
}, {passive:false});

var drag = {on:false, x:0, left:0, moved:false};
strip.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  drag.on = true; drag.x = e.clientX; drag.left = strip.scrollLeft; drag.moved = false;
});
window.addEventListener('pointermove', function(e){
  if(!drag.on) return;
  var d = e.clientX - drag.x;
  if(Math.abs(d) > 4){
    drag.moved = true;
    strip.classList.add('dragging');
    strip.scrollLeft = drag.left - d;
  }
});
window.addEventListener('pointerup', function(){
  if(drag.on && drag.moved){
    strip.addEventListener('click', function kill(ev){
      ev.preventDefault(); ev.stopPropagation();
      strip.removeEventListener('click', kill, true);
    }, true);
  }
  drag.on = false;
  strip.classList.remove('dragging');
});
window.addEventListener('pointercancel', function(){ drag.on = false; strip.classList.remove('dragging'); });

$('refresh').addEventListener('click', function(){ refresh(); });

document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'unv'){
    state.unverified = !state.unverified;
    state.shown = 60;
    render();
  }
});

(async function(){
  await loadHeroIcons();
  await loadReleased();
  if(loadCache()){
    renderHeroes(); render();
    say('cached catalog — checking for updates…', true);
  }else say('fetching catalog…', true);
  refresh();
})();
</script>
